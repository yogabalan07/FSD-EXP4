<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Registration</title>

    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            color: white;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(124, 58, 237, 0.35),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(6, 182, 212, 0.30),
                    transparent 30%
                ),
                #080d1c;

            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND ANIMATION
        ========================= */

        .background-circle {
            position: fixed;

            border-radius: 50%;

            filter: blur(70px);

            opacity: 0.35;

            z-index: -1;

            animation: floating 7s infinite alternate ease-in-out;
        }

        .circle1 {
            width: 250px;
            height: 250px;

            background: #7c3aed;

            top: -80px;
            left: -80px;
        }

        .circle2 {
            width: 300px;
            height: 300px;

            background: #06b6d4;

            bottom: -100px;
            right: -100px;

            animation-delay: 2s;
        }

        @keyframes floating {

            from {
                transform: translateY(0px);
            }

            to {
                transform: translateY(60px);
            }

        }


        /* =========================
           MAIN CARD
        ========================= */

        .container {

            width: 100%;
            max-width: 480px;

            padding: 35px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45);

            animation: cardEnter 0.8s ease;

        }

        @keyframes cardEnter {

            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;

            margin-bottom: 30px;
        }

        .logo {

            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 22px;

            font-size: 32px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );

            box-shadow:
                0 15px 40px rgba(124, 58, 237, 0.4);

            animation: logoFloat 3s infinite ease-in-out;

        }

        @keyframes logoFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }

        .header h1 {

            font-size: 28px;

            margin-bottom: 8px;

        }

        .header p {

            font-size: 14px;

            color: #9da7bb;

        }


        /* =========================
           INPUT GROUP
        ========================= */

        .input-group {

            margin-bottom: 20px;

        }

        .input-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #e7eaf0;

        }


        /* =========================
           INPUT BOX
        ========================= */

        .input-box {

            position: relative;

        }

        .input-box input {

            width: 100%;

            padding: 15px 45px 15px 16px;

            border-radius: 14px;

            outline: none;

            border: 1px solid rgba(255,255,255,0.15);

            background: rgba(255,255,255,0.07);

            color: white;

            font-size: 15px;

            transition: 0.3s;

        }

        .input-box input::placeholder {

            color: #737e94;

        }

        .input-box input:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139,92,246,0.15),
                0 0 25px rgba(139,92,246,0.12);

        }


        /* =========================
           VALID / INVALID INPUT
        ========================= */

        .input-box input.valid {

            border-color: #22c55e;

            box-shadow:
                0 0 15px rgba(34,197,94,0.08);

        }

        .input-box input.invalid {

            border-color: #ef4444;

            box-shadow:
                0 0 15px rgba(239,68,68,0.08);

        }


        /* =========================
           STATUS ICON
        ========================= */

        .status-icon {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

        }


        /* =========================
           ERROR
        ========================= */

        .error {

            display: none;

            margin-top: 6px;

            font-size: 12px;

            color: #ff6b81;

            animation: errorAnimation 0.3s ease;

        }

        @keyframes errorAnimation {

            from {
                opacity: 0;
                transform: translateX(-8px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }


        /* =========================
           PASSWORD TOGGLE
        ========================= */

        .password-toggle {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            font-size: 17px;

            color: #9ba4b8;

            user-select: none;

        }


        /* =========================
           PASSWORD STRENGTH
        ========================= */

        .strength {

            width: 100%;

            height: 5px;

            margin-top: 10px;

            border-radius: 20px;

            overflow: hidden;

            background: #252c3d;

        }

        .strength-bar {

            width: 0%;

            height: 100%;

            border-radius: 20px;

            transition: width 0.4s ease;

        }

        .strength-text {

            margin-top: 6px;

            font-size: 11px;

            color: #8993a7;

        }


        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-btn {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 15px;

            cursor: pointer;

            color: white;

            font-size: 16px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );

            box-shadow:
                0 12px 30px rgba(124,58,237,0.35);

            transition: 0.3s;

        }

        .submit-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 18px 40px rgba(124,58,237,0.45);

        }

        .submit-btn:active {

            transform: scale(0.98);

        }


        /* =========================
           WELCOME SCREEN
        ========================= */

        .welcome {

            display: none;

            text-align: center;

            padding: 20px 5px;

            animation: welcomeAnimation 0.8s ease;

        }

        @keyframes welcomeAnimation {

            from {

                opacity: 0;

                transform:
                    scale(0.8)
                    translateY(30px);

            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

            }

        }


        /* =========================
           WELCOME ICON
        ========================= */

        .welcome-icon {

            width: 100px;

            height: 100px;

            margin: 0 auto 25px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 50%;

            font-size: 48px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );

            box-shadow:
                0 20px 50px rgba(124,58,237,0.4);

            animation:
                successPop 0.8s ease;

        }

        @keyframes successPop {

            0% {
                transform: scale(0);
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }

        }


        /* =========================
           WELCOME TEXT
        ========================= */

        .welcome h2 {

            font-size: 30px;

            margin-bottom: 12px;

        }

        #welcomeName {

            background:
                linear-gradient(
                    90deg,
                    #a78bfa,
                    #22d3ee
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }

        .welcome p {

            color: #aab2c5;

            line-height: 1.6;

            margin-bottom: 25px;

        }


        /* =========================
           CONTINUE BUTTON
        ========================= */

        .continue-btn {

            border: none;

            padding: 14px 30px;

            border-radius: 12px;

            cursor: pointer;

            color: white;

            font-size: 15px;

            font-weight: 600;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );

            transition: 0.3s;

        }

        .continue-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(124,58,237,0.4);

        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 500px) {

            body {
                padding: 15px;
            }

            .container {

                padding: 25px 20px;

                border-radius: 22px;

            }

            .header h1 {

                font-size: 24px;

            }

            .welcome h2 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <!-- Background -->

    <div class="background-circle circle1"></div>

    <div class="background-circle circle2"></div>


    <!-- Main Container -->

    <div class="container">


        <!-- =========================
             REGISTRATION FORM
        ========================== -->

        <div id="registrationSection">

            <div class="header">

                <div class="logo">
                    ⚡
                </div>

                <h1>
                    Create Account
                </h1>

                <p>
                    Register with smart frontend validation
                </p>

            </div>


            <form id="registerForm">


                <!-- NAME -->

                <div class="input-group">

                    <label>
                        Full Name
                    </label>

                    <div class="input-box">

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                        >

                        <span
                            class="status-icon"
                            id="nameIcon"
                        ></span>

                    </div>

                    <div
                        class="error"
                        id="nameError"
                    ></div>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label>
                        Email Address
                    </label>

                    <div class="input-box">

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                        >

                        <span
                            class="status-icon"
                            id="emailIcon"
                        ></span>

                    </div>

                    <div
                        class="error"
                        id="emailError"
                    ></div>

                </div>


                <!-- MOBILE -->

                <div class="input-group">

                    <label>
                        Mobile Number
                    </label>

                    <div class="input-box">

                        <input
                            type="text"
                            id="mobile"
                            placeholder="Enter 10-digit mobile number"
                            maxlength="10"
                            inputmode="numeric"
                        >

                        <span
                            class="status-icon"
                            id="mobileIcon"
                        ></span>

                    </div>

                    <div
                        class="error"
                        id="mobileError"
                    ></div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                        >

                        <span
                            class="password-toggle"
                            id="togglePassword"
                        >
                            👁
                        </span>

                    </div>


                    <div class="strength">

                        <div
                            class="strength-bar"
                            id="strengthBar"
                        ></div>

                    </div>


                    <div
                        class="strength-text"
                        id="strengthText"
                    >
                        Password strength
                    </div>


                    <div
                        class="error"
                        id="passwordError"
                    ></div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label>
                        Confirm Password
                    </label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                        >

                        <span
                            class="status-icon"
                            id="confirmIcon"
                        ></span>

                    </div>

                    <div
                        class="error"
                        id="confirmError"
                    ></div>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Create Account →
                </button>


            </form>

        </div>


        <!-- =========================
             WELCOME SCREEN
        ========================== -->

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-icon">
                🎉
            </div>

            <h2>
                Welcome,
                <span id="welcomeName"></span>!
            </h2>

            <p>
                Your account has been created successfully.
                <br>
                We're excited to have you here.
            </p>

            <button
                class="continue-btn"
                onclick="location.reload()"
            >
                Continue →
            </button>

        </div>


    </div>


    <script>


        /* =========================
           GET ELEMENTS
        ========================== */

        const form =
            document.getElementById("registerForm");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const mobileInput =
            document.getElementById("mobile");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");


        /* =========================
           NAME VALIDATION
        ========================== */

        function validateName() {

            const value =
                nameInput.value.trim();

            const error =
                document.getElementById("nameError");

            const icon =
                document.getElementById("nameIcon");


            if (value === "") {

                showError(
                    nameInput,
                    error,
                    icon,
                    "Name is required"
                );

                return false;

            }


            if (value.length < 3) {

                showError(
                    nameInput,
                    error,
                    icon,
                    "Name must contain at least 3 characters"
                );

                return false;

            }


            showSuccess(
                nameInput,
                error,
                icon
            );

            return true;

        }


        /* =========================
           EMAIL VALIDATION
        ========================== */

        function validateEmail() {

            const value =
                emailInput.value.trim();

            const error =
                document.getElementById("emailError");

            const icon =
                document.getElementById("emailIcon");


            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (value === "") {

                showError(
                    emailInput,
                    error,
                    icon,
                    "Email is required"
                );

                return false;

            }


            if (!emailPattern.test(value)) {

                showError(
                    emailInput,
                    error,
                    icon,
                    "Enter a valid email address"
                );

                return false;

            }


            showSuccess(
                emailInput,
                error,
                icon
            );

            return true;

        }


        /* =========================
           MOBILE VALIDATION
        ========================== */

        function validateMobile() {

            const value =
                mobileInput.value.trim();

            const error =
                document.getElementById("mobileError");

            const icon =
                document.getElementById("mobileIcon");


            const mobilePattern =
                /^[6-9][0-9]{9}$/;


            if (value === "") {

                showError(
                    mobileInput,
                    error,
                    icon,
                    "Mobile number is required"
                );

                return false;

            }


            if (!mobilePattern.test(value)) {

                showError(
                    mobileInput,
                    error,
                    icon,
                    "Enter a valid 10-digit mobile number"
                );

                return false;

            }


            showSuccess(
                mobileInput,
                error,
                icon
            );

            return true;

        }


        /* =========================
           PASSWORD VALIDATION
        ========================== */

        function validatePassword() {

            const value =
                passwordInput.value;

            const error =
                document.getElementById("passwordError");

            const bar =
                document.getElementById("strengthBar");

            const text =
                document.getElementById("strengthText");


            let score = 0;


            if (value.length >= 8) {
                score++;
            }

            if (/[A-Z]/.test(value)) {
                score++;
            }

            if (/[a-z]/.test(value)) {
                score++;
            }

            if (/[0-9]/.test(value)) {
                score++;
            }

            if (/[^A-Za-z0-9]/.test(value)) {
                score++;
            }


            /* Empty password */

            if (value === "") {

                bar.style.width = "0%";

                text.textContent =
                    "Password strength";

                error.style.display =
                    "none";

                passwordInput.classList.remove(
                    "valid",
                    "invalid"
                );

                return false;

            }


            /* Weak */

            if (score <= 2) {

                bar.style.width = "30%";

                text.textContent =
                    "Weak password";

                error.textContent =
                    "Use 8+ characters with numbers and symbols";

                error.style.display =
                    "block";

                passwordInput.classList.add(
                    "invalid"
                );

                passwordInput.classList.remove(
                    "valid"
                );

                return false;

            }


            /* Medium */

            if (score === 3) {

                bar.style.width = "55%";

                text.textContent =
                    "Medium password";

                error.style.display =
                    "none";

                passwordInput.classList.add(
                    "valid"
                );

                passwordInput.classList.remove(
                    "invalid"
                );

                return true;

            }


            /* Strong */

            if (score === 4) {

                bar.style.width = "80%";

                text.textContent =
                    "Strong password";

                error.style.display =
                    "none";

                passwordInput.classList.add(
                    "valid"
                );

                passwordInput.classList.remove(
                    "invalid"
                );

                return true;

            }


            /* Very Strong */

            if (score >= 5) {

                bar.style.width = "100%";

                text.textContent =
                    "Very strong password";

                error.style.display =
                    "none";

                passwordInput.classList.add(
                    "valid"
                );

                passwordInput.classList.remove(
                    "invalid"
                );

                return true;

            }

        }


        /* =========================
           CONFIRM PASSWORD
        ========================== */

        function validateConfirmPassword() {

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            const error =
                document.getElementById(
                    "confirmError"
                );

            const icon =
                document.getElementById(
                    "confirmIcon"
                );


            if (confirmPassword === "") {

                showError(
                    confirmPasswordInput,
                    error,
                    icon,
                    "Please confirm your password"
                );

                return false;

            }


            if (
                password !== confirmPassword
            ) {

                showError(
                    confirmPasswordInput,
                    error,
                    icon,
                    "Passwords do not match"
                );

                return false;

            }


            showSuccess(
                confirmPasswordInput,
                error,
                icon
            );

            return true;

        }


        /* =========================
           SHOW ERROR
        ========================== */

        function showError(
            input,
            error,
            icon,
            message
        ) {

            input.classList.add("invalid");

            input.classList.remove("valid");

            error.textContent = message;

            error.style.display = "block";

            icon.textContent = "❌";

        }


        /* =========================
           SHOW SUCCESS
        ========================== */

        function showSuccess(
            input,
            error,
            icon
        ) {

            input.classList.add("valid");

            input.classList.remove("invalid");

            error.style.display = "none";

            icon.textContent = "✓";

        }


        /* =========================
           REAL-TIME VALIDATION
        ========================== */

        nameInput.addEventListener(
            "input",
            validateName
        );


        emailInput.addEventListener(
            "input",
            validateEmail
        );


        mobileInput.addEventListener(
            "input",
            function () {

                /*
                    Allow only numbers
                */

                this.value =
                    this.value.replace(
                        /[^0-9]/g,
                        ""
                    );

                validateMobile();

            }
        );


        passwordInput.addEventListener(
            "input",
            function () {

                validatePassword();


                /*
                    Re-check confirm password
                    when password changes
                */

                if (
                    confirmPasswordInput.value !== ""
                ) {

                    validateConfirmPassword();

                }

            }
        );


        confirmPasswordInput.addEventListener(
            "input",
            validateConfirmPassword
        );


        /* =========================
           SHOW / HIDE PASSWORD
        ========================== */

        document
            .getElementById("togglePassword")
            .addEventListener(
                "click",
                function () {

                    if (
                        passwordInput.type ===
                        "password"
                    ) {

                        passwordInput.type =
                            "text";

                        this.textContent =
                            "🙈";

                    } else {

                        passwordInput.type =
                            "password";

                        this.textContent =
                            "👁";

                    }

                }
            );


        /* =========================
           FORM SUBMISSION
        ========================== */

        form.addEventListener(
            "submit",
            function (event) {

                /*
                    Prevent page refresh
                */

                event.preventDefault();


                /*
                    Validate everything
                */

                const validName =
                    validateName();

                const validEmail =
                    validateEmail();

                const validMobile =
                    validateMobile();

                const validPassword =
                    validatePassword();

                const validConfirm =
                    validateConfirmPassword();


                /*
                    Check all validations
                */

                if (
                    validName &&
                    validEmail &&
                    validMobile &&
                    validPassword &&
                    validConfirm
                ) {


                    /* =====================
                       GET USER NAME
                    ===================== */

                    const userName =
                        nameInput.value.trim();


                    /* =====================
                       DISPLAY USER NAME
                    ===================== */

                    document
                        .getElementById(
                            "welcomeName"
                        )
                        .textContent =
                        userName;


                    /* =====================
                       HIDE REGISTRATION
                    ===================== */

                    document
                        .getElementById(
                            "registrationSection"
                        )
                        .style.display =
                        "none";


                    /* =====================
                       SHOW WELCOME
                    ===================== */

                    document
                        .getElementById(
                            "welcome"
                        )
                        .style.display =
                        "block";

                }

            }
        );

    </script>

</body>

</html>
